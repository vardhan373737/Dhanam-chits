<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chit Payment - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 12% 16%, rgba(245, 158, 11, 0.28), transparent 34%), radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.34), transparent 36%), linear-gradient(145deg, #042534, #0a3c52 46%, #12506f);
            color: #10213a;
            display: block;
        }

        .navbar {
            background: linear-gradient(100deg, rgba(4, 37, 52, 0.92), rgba(10, 60, 82, 0.88), rgba(18, 80, 111, 0.86));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .container {
            width: min(94%, 720px);
            margin: 1.4rem auto 2rem;
            padding: 24px;
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
            box-shadow: 0 30px 70px rgba(10, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .summary-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(16, 33, 58, 0.1);
            box-shadow: 0 14px 36px rgba(10, 20, 40, 0.14);
            margin-bottom: 18px;
        }

        .summary-title {
            margin: 0 0 10px;
            color: #0f1f39;
            font-weight: 800;
        }

        .summary-item {
            margin: 5px 0;
            font-weight: 700;
            color: #1d2f4c;
        }

        .btn-primary {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            border: none;
            font-weight: 700;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .back-button {
            border: none;
            background: linear-gradient(120deg, #2f4f6f, #3a6f8a);
            color: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            margin-left: 8px;
        }

        .helper {
            font-size: 0.9rem;
            color: #274766;
            margin-top: 6px;
        }

        .btn-cashfree {
            background: linear-gradient(120deg, #0f172a, #0b607f);
            border: none;
            color: #fff;
            font-weight: 700;
            margin-left: 8px;
        }

        .payment-status {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
        }

        .payment-status.info {
            display: block;
            background: rgba(8, 145, 178, 0.12);
            color: #0b607f;
            border: 1px solid rgba(8, 145, 178, 0.25);
        }

        .payment-status.error {
            display: block;
            background: rgba(185, 28, 28, 0.1);
            color: #9f1239;
            border: 1px solid rgba(185, 28, 28, 0.2);
        }

        .payment-status.success {
            display: block;
            background: rgba(15, 118, 110, 0.12);
            color: #0f766e;
            border: 1px solid rgba(15, 118, 110, 0.22);
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand d-flex align-items-center" href="Login.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="moneyborrow.html">Money Borrow</a></li>
                    <li class="nav-item"><a class="nav-link" href="borrowhistory.html">Borrow History</a></li>
                    <li class="nav-item"><a class="nav-link" href="bankdetails.html">Bank Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="Chitid.html">Chitfunds</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="summary-card">
            <h2 class="summary-title">Chit Payment</h2>
            <p class="summary-item" id="summaryChitId">Chit ID: -</p>
            <p class="summary-item" id="summaryMobile">Mobile: -</p>
            <p class="summary-item" id="summaryBalance">Total Balance: -</p>
            <p class="summary-item" id="summaryPaid">Total Paid: -</p>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="text" class="form-control" id="mobile" required readonly>
            </div>

            <div class="form-group">
                <label for="chitsPlan">Chit Plan</label>
                <input type="text" class="form-control" id="chitsPlan" required readonly>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" min="1" required>
                <div class="helper">Enter the amount you are paying now.</div>
            </div>

            <div class="form-group">
                <label for="utrNumber">UTR Number</label>
                <input type="text" class="form-control" id="utrNumber" required>
                <div class="helper">Required only for manual transfer.</div>
            </div>

            <div class="form-group">
                <label for="type">Payment Type</label>
                <input type="text" class="form-control" id="type" value="Chit Payment" readonly>
            </div>

            <button type="submit" class="btn btn-primary" id="manualSubmitBtn">Submit Manual UTR Payment</button>
            <button type="button" class="btn btn-cashfree" id="cashfreePayBtn">Pay with Cashfree</button>
            <button type="button" class="back-button" onclick="window.location.href='Chitid.html'">Back to Chit ID</button>
            <div id="paymentStatus" class="payment-status"></div>
        </form>
    </main>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const queryChitId = (params.get('chitId') || '').trim();
        const queryMobile = (params.get('mobile') || '').trim();
        const queryTotalBalance = (params.get('totalBalance') || '').trim();
        const queryTotalPaid = (params.get('totalPaid') || '').trim();
        const queryName = (params.get('name') || '').trim();

        const user = JSON.parse(localStorage.getItem('user') || '{}');

        document.getElementById('summaryChitId').textContent = `Chit ID: ${queryChitId || '-'}`;
        document.getElementById('summaryMobile').textContent = `Mobile: ${queryMobile || '-'}`;
        document.getElementById('summaryBalance').textContent = `Total Balance: ${queryTotalBalance || '-'}`;
        document.getElementById('summaryPaid').textContent = `Total Paid: ${queryTotalPaid || '-'}`;

        document.getElementById('name').value = queryName || user.fullname || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('mobile').value = queryMobile || user.mobile || '';
        document.getElementById('chitsPlan').value = queryChitId;

        const paymentForm = document.getElementById('paymentForm');
        const manualSubmitBtn = document.getElementById('manualSubmitBtn');
        const cashfreePayBtn = document.getElementById('cashfreePayBtn');
        const paymentStatus = document.getElementById('paymentStatus');

        function setPaymentStatus(message, type = 'info') {
            paymentStatus.textContent = message;
            paymentStatus.className = `payment-status ${type}`;
        }

        function clearPaymentStatus() {
            paymentStatus.textContent = '';
            paymentStatus.className = 'payment-status';
        }

        function setButtonsDisabled(disabled) {
            manualSubmitBtn.disabled = disabled;
            cashfreePayBtn.disabled = disabled;
        }

        async function apiFetch(url, options = {}) {
            const mergedOptions = {
                credentials: 'include',
                ...options,
                headers: {
                    ...(options.headers || {}),
                },
            };

            const response = await fetch(url, mergedOptions);
            if (response.status === 401 || response.status === 403) {
                const message = response.status === 401
                    ? 'Your session has expired. Please login again.'
                    : 'You are not authorized for this action.';
                alert(message);
                window.location.href = 'Login.html';
                throw new Error(message);
            }

            return response;
        }

        function collectPaymentPayload(includeUtr = true) {
            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                mobile: document.getElementById('mobile').value.trim(),
                chitsPlan: document.getElementById('chitsPlan').value.trim(),
                amount: Number(document.getElementById('amount').value),
                utrNumber: document.getElementById('utrNumber').value.trim(),
                type: document.getElementById('type').value.trim(),
            };

            if (!payload.name || !payload.email || !payload.mobile || !payload.chitsPlan || !payload.amount || payload.amount <= 0) {
                throw new Error('Name, email, mobile, chit plan and amount are required.');
            }

            if (includeUtr && !payload.utrNumber) {
                throw new Error('UTR number is required for manual submission.');
            }

            return payload;
        }

        if (!queryChitId || !document.getElementById('mobile').value) {
            alert('Invalid payment request. Please open this page using Pay Now from Chit ID page.');
        }

        paymentForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            try {
                clearPaymentStatus();
                setButtonsDisabled(true);
                setPaymentStatus('Submitting manual payment details...', 'info');
                const payload = collectPaymentPayload(true);

                const response = await apiFetch('/api/bank-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.message || 'Payment submission failed');
                }

                setPaymentStatus(result.message || 'Payment submitted successfully', 'success');
                alert(result.message || 'Payment submitted successfully');
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Payment submit error:', error);
                setPaymentStatus(error.message || 'Failed to submit payment. Please try again.', 'error');
                alert(error.message || 'Failed to submit payment. Please try again.');
            } finally {
                setButtonsDisabled(false);
            }
        });

        cashfreePayBtn.addEventListener('click', async () => {
            try {
                clearPaymentStatus();
                setButtonsDisabled(true);
                setPaymentStatus('Creating Cashfree order...', 'info');

                const paymentData = collectPaymentPayload(false);
                paymentData.type = 'Chit Payment (Cashfree)';

                const createOrderResponse = await apiFetch('/api/cashfree/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData),
                });

                const createOrderResult = await createOrderResponse.json().catch(() => ({}));
                if (!createOrderResponse.ok) {
                    throw new Error(createOrderResult.message || 'Unable to initialize Cashfree payment.');
                }

                if (!window.Cashfree || !createOrderResult.paymentSessionId) {
                    throw new Error('Cashfree SDK failed to initialize. Please refresh and try again.');
                }

                const cashfree = window.Cashfree({ mode: createOrderResult.cashfreeMode || 'sandbox' });
                setPaymentStatus('Opening Cashfree checkout...', 'info');

                const checkoutResult = await cashfree.checkout({
                    paymentSessionId: createOrderResult.paymentSessionId,
                    redirectTarget: '_modal',
                });

                if (checkoutResult?.error) {
                    throw new Error(checkoutResult.error.message || 'Cashfree checkout failed.');
                }

                setPaymentStatus('Verifying payment status...', 'info');

                const verifyResponse = await apiFetch('/api/cashfree/confirm-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: createOrderResult.orderId,
                        paymentData,
                    }),
                });

                const verifyResult = await verifyResponse.json().catch(() => ({}));
                if (!verifyResponse.ok) {
                    throw new Error(verifyResult.message || 'Payment verification failed.');
                }

                setPaymentStatus(verifyResult.message || 'Payment completed successfully.', 'success');
                alert(verifyResult.message || 'Payment completed successfully.');
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Cashfree payment error:', error);
                setPaymentStatus(error.message || 'Cashfree payment failed. Please try again.', 'error');
                alert(error.message || 'Cashfree payment failed. Please try again.');
            } finally {
                setButtonsDisabled(false);
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
