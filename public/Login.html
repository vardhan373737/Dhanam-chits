<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        header {
            background: linear-gradient(45deg, #090a0b, #6610f2);
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateZ(0);
            transition: transform 0.3s ease;
        }

        header:hover {
            transform: translateY(-2px);
        }

        .navbar-brand h1 {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .navbar-toggler {
            border-color: transparent;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml;charset=UTF8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cpath stroke='black' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: bold;
        }

        .navbar-nav .nav-link:hover {
            color: #ffc107 !important;
            text-decoration: underline;
        }

        body {
            background: radial-gradient(circle at 12% 16%, rgba(245, 158, 11, 0.28), transparent 34%),
                        radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.34), transparent 36%),
                        linear-gradient(145deg, #042534, #0a3c52 46%, #12506f);
            min-height: 100vh;
            margin: 0;
            display: block;
        }

        .form-container {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
            border-radius: 22px;
            box-shadow: 0 30px 70px rgba(10, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 24px;
            width: min(94%, 520px);
            margin: 1.4rem auto 2rem;
        }

        .form-container h2 {
            text-align: center;
            color: #0f1f39;
            margin-bottom: 16px;
        }

        .btn-primary {
            border: none;
            background: linear-gradient(120deg, #0f766e, #0891b2);
            font-weight: 700;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .account-links {
            margin-top: 14px;
            text-align: center;
        }

        .account-links a {
            color: #0b607f;
            font-weight: 600;
        }

        .notice {
            background: linear-gradient(120deg, #ffe2a4, #ffd58a);
            color: #543c0b;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(245, 158, 11, 0.45);
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand d-flex align-items-center" href="Login.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); transition: transform 0.3s ease;">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="ChittyPlans.html">Chit Plans</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payment Form</a></li>
                    <li class="nav-item"><a class="nav-link" href="home.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="form-container">
        <div class="notice">Welcome back. Login to continue.</div>
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="mobile">Phone Number</label>
                <input type="text" class="form-control" id="mobile" name="mobile" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="account-links">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p><a href="resetpassword.html">Forgot Password?</a></p>
        </div>
    </main>

    <script>
        const LOGIN_API_BASES = ['/api', '', window.LOGIN_API_BASE || '']
            .filter((base, index, arr) => base !== undefined && arr.indexOf(base) === index);

        async function postWithFallback(path, payload) {
            let lastError = null;
            for (const base of LOGIN_API_BASES) {
                try {
                    const response = await fetch(`${base}${path}`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json().catch(() => ({}));
                    return { response, data };
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('No backend is reachable');
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!mobile || !password) {
                alert('Please enter both mobile and password.');
                return;
            }

            try {
                const { response, data } = await postWithFallback('/login', { mobile, password });

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (data.user && data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    alert(data.message || 'Login failed.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Error connecting to server.');
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
