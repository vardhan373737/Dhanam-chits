<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: radial-gradient(circle at 12% 16%, rgba(245, 158, 11, 0.28), transparent 34%),
                        radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.34), transparent 36%),
                        linear-gradient(145deg, #042534, #0a3c52 46%, #12506f);
            min-height: 100vh;
            margin: 0;
            display: block;
            color: #10213a;
        }

        .container-box {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
            border-radius: 22px;
            box-shadow: 0 30px 70px rgba(10, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: min(94%, 560px);
            padding: 24px;
            margin: 1.4rem auto 2rem;
        }

        .container-box h2 {
            text-align: center;
            color: #0f1f39;
            margin-bottom: 14px;
        }

        .notice {
            background: linear-gradient(120deg, #ffe2a4, #ffd58a);
            color: #543c0b;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(245, 158, 11, 0.45);
        }

        .form-group label {
            font-weight: 700;
            color: #16324f;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid rgba(15, 31, 57, 0.2);
            height: 44px;
        }

        .form-control:focus {
            border-color: #0891b2;
            box-shadow: 0 0 0 0.2rem rgba(8, 145, 178, 0.2);
        }

        .btn-primary {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            border: none;
            font-weight: 700;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .message {
            margin-top: 10px;
            font-weight: 700;
            display: none;
        }

        .message.success { color: #0f766e; }
        .message.error { color: #c0392b; }

        .navbar {
            background: linear-gradient(100deg, rgba(4, 37, 52, 0.92), rgba(10, 60, 82, 0.88), rgba(18, 80, 111, 0.86));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand d-flex align-items-center" href="Login.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
        </nav>
    </header>

    <main class="container-box">
        <div class="notice">Reset your password using registered mobile + email OTP verification.</div>
        <h2>Reset Password</h2>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="mobile">Registered Mobile Number</label>
                <input type="text" class="form-control" id="mobile" required>
            </div>
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <button type="button" class="btn btn-outline-primary btn-block mb-3" id="sendOtpButton">Send OTP</button>
            <div class="form-group">
                <label for="otp">OTP (sent to email)</label>
                <input type="text" class="form-control" id="otp" maxlength="6" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" class="form-control" id="newPassword" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            <div id="message" class="message"></div>
        </form>
        <a href="Login.html" class="btn btn-outline-secondary btn-block mt-2">Back to Login</a>
    </main>

    <script>
        let resetToken = '';

        document.getElementById('sendOtpButton').addEventListener('click', async () => {
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message');

            message.style.display = 'none';
            message.textContent = '';
            message.classList.remove('success', 'error');

            if (!mobile || !email) {
                message.textContent = 'Please enter registered mobile number and email.';
                message.classList.add('error');
                message.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/reset-password/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, email }),
                    credentials: 'include',
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    message.textContent = result.message || 'Failed to send OTP.';
                    message.classList.add('error');
                    message.style.display = 'block';
                    return;
                }

                resetToken = result.resetToken || '';
                message.textContent = result.message || 'OTP sent to your email.';
                message.classList.add('success');
                message.style.display = 'block';
            } catch (error) {
                console.error('Send OTP error:', error);
                message.textContent = 'Error connecting to server.';
                message.classList.add('error');
                message.style.display = 'block';
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');

            message.style.display = 'none';
            message.textContent = '';
            message.classList.remove('success', 'error');

            if (!mobile || !email) {
                message.textContent = 'Please enter your registered mobile and email.';
                message.classList.add('error');
                message.style.display = 'block';
                return;
            }

            if (!resetToken) {
                message.textContent = 'Please click Send OTP first.';
                message.classList.add('error');
                message.style.display = 'block';
                return;
            }

            if (!otp) {
                message.textContent = 'Please enter the OTP sent to your email.';
                message.classList.add('error');
                message.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent = 'New password and confirm password do not match.';
                message.classList.add('error');
                message.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resetToken, otp, mobile, email, newPassword, confirmPassword }),
                    credentials: 'include',
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    message.textContent = result.message || 'Failed to reset password.';
                    message.classList.add('error');
                    message.style.display = 'block';
                    return;
                }

                message.textContent = result.message || 'Password reset successful. Please login.';
                message.classList.add('success');
                message.style.display = 'block';
                document.getElementById('resetPasswordForm').reset();
            } catch (error) {
                console.error('Reset password error:', error);
                message.textContent = 'Error connecting to server.';
                message.classList.add('error');
                message.style.display = 'block';
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
