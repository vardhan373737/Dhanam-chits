<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --ink-strong: #0d213b;
            --ink-soft: #57708b;
            --line-soft: rgba(24, 55, 89, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(255, 255, 255, 0.6);
            --surface-shadow: 0 20px 42px rgba(16, 49, 75, 0.16);
            --blue-a: #1d4ed8;
            --blue-b: #0284c7;
            --red-a: #dc2626;
            --red-b: #ef4444;
            --teal-a: #0f766e;
            --teal-b: #0891b2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', 'Segoe UI', sans-serif;
        }

        body {
            display: block !important;
            min-height: 100vh;
            background:
                radial-gradient(circle at 8% 12%, rgba(8, 145, 178, 0.2), transparent 28%),
                radial-gradient(circle at 90% 8%, rgba(37, 99, 235, 0.16), transparent 24%),
                linear-gradient(160deg, #e9f7fb 0%, #eef5ff 45%, #f8fbfd 100%);
            color: var(--ink-strong);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100%;
            background: #2c3e50;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.3s;
            overflow: hidden;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            transition: 0.3s;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        .sidebar a i {
            margin-right: 10px;
            font-size: 18px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #34495e;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.35);
            transform: translateX(2px);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e74c3c;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            margin-top: 50px;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        .logout-btn:hover {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            transform: scale(1.05);
        }

        /* Toggle Button */
        .menu-toggle {
            display: none;
            position: fixed;
            left: 10px;
            top: 10px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            z-index: 1000;
        }

        /* Content */
        .content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 24px;
            transition: margin-left 0.3s;
            overflow-x: hidden;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                width: 60px;
                padding: 10px;
            }

            .sidebar h2 {
                display: none;
            }

            .sidebar a {
                justify-content: center;
                padding: 10px;
            }

            .sidebar a i {
                font-size: 18px;
                margin: 0;
            }

            .content {
                margin-left: 60px;
                width: calc(100% - 60px);
            }

        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 14px 30px rgba(30, 79, 116, 0.14);
        }

        table th, table td {
            padding: 14px 12px;
            text-align: center;
            border: 1px solid var(--line-soft);
            color: var(--ink-strong);
        }

        table th {
            background: linear-gradient(90deg, #2482d8, #509ee6);
            color: #fff;
            letter-spacing: 0.25px;
            font-weight: 800;
        }

        table tr:hover {
            background-color: rgba(46, 145, 255, 0.08);
            transition: 0.3s ease-in-out;
        }

        td a {
            color: #0b5cad;
            font-weight: 700;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        td select {
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--ink-strong);
            font-weight: 600;
            outline: none;
        }

        td select:focus {
            border-color: rgba(51, 138, 206, 0.7);
            box-shadow: 0 0 0 3px rgba(76, 162, 232, 0.16);
        }

        .btn-edit {
            background: linear-gradient(130deg, var(--blue-a), var(--blue-b));
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            font-weight: 700;
        }

        .btn-edit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(38, 112, 199, 0.3);
        }

        .btn-delete {
            background: linear-gradient(130deg, var(--red-a), var(--red-b));
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            font-weight: 700;
        }

        .btn-delete:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(188, 57, 77, 0.34);
        }

        .borrow-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .borrow-toolbar h1 {
            margin: 0;
            color: #0f2a3f;
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 800;
            letter-spacing: 0.2px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        .toolbar-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            background: linear-gradient(120deg, var(--teal-a), var(--teal-b));
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(10, 43, 64, 0.22);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .toolbar-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(10, 43, 64, 0.28);
        }

        .quick-stats {
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: linear-gradient(125deg, rgba(12, 55, 86, 0.95), rgba(25, 129, 157, 0.88));
            color: #f1f8ff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 12px 24px rgba(9, 40, 65, 0.23);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 999px;
            right: -52px;
            top: -70px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
        }

        .stat-card .label {
            display: block;
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.28rem;
            font-weight: 800;
        }

        .dashboard-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--surface-shadow);
            padding: 12px;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            backdrop-filter: blur(6px);
        }

        .btn-logout {
            display: none;
        }

        @media (max-width: 576px) {
            .borrow-toolbar {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
            }

            .borrow-toolbar h1 {
                font-size: 2rem;
                line-height: 1.05;
                max-width: calc(100% - 120px);
            }

            .toolbar-btn {
                margin-left: auto;
                padding: 8px 12px;
            }

            .quick-stats {
                grid-template-columns: 1fr;
            }

            table {
                width: max-content;
                min-width: 920px;
                white-space: nowrap;
            }
        }
    </style>
    <link rel="stylesheet" href="admin-sidebar.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <!-- Toggle Button -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="admin.html"><i class="fas fa-tachometer-alt"></i> <span class="menu-text">Dashboard</span></a>
        <a href="users.html"><i class="fas fa-users"></i> <span class="menu-text">Users</span></a>
            <a href="adminbank.html"><i class="fas fa-university"></i> <span class="menu-text">Admin-Bank</span></a>

        <a href="bankdetailA.html"><i class="fas fa-university"></i> <span class="menu-text">Bank Details</span></a>
        <a href="borrowA.html"><i class="fas fa-hand-holding-usd"></i> <span class="menu-text">Borrows</span></a>
        <a href="ChitidA.html"><i class="fas fa-university"></i> <span class="menu-text">Chit-ids Approve</span></a>
        <a href="paymentA.html"><i class="fas fa-credit-card"></i> <span class="menu-text">Payments</span></a>
        <a href="contactA.html"><i class="fas fa-envelope"></i> <span class="menu-text">Contact Details</span></a>
        <a href="/Login.html" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span class="menu-text">Logout</span></a>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="borrow-toolbar">
            <h1>Borrow History</h1>
            <button class="toolbar-btn" onclick="fetchBorrowHistory()">Refresh</button>
        </div>

        <div class="quick-stats">
            <div class="stat-card">
                <span class="label">Total Borrow Requests</span>
                <span class="value" id="total-borrows">0</span>
            </div>
            <div class="stat-card">
                <span class="label">Pending Requests</span>
                <span class="value" id="pending-borrows">0</span>
            </div>
            <div class="stat-card">
                <span class="label">Approved Requests</span>
                <span class="value" id="approved-borrows">0</span>
            </div>
        </div>

        <div class="dashboard-container">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Amount</th>
                        <th>Documents</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="borrow-history-table">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>

        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <script>
        function normalizeDocPath(pathValue) {
            const pathText = String(pathValue || '').trim();
            if (!pathText) {
                return '';
            }

            return pathText.startsWith('/') ? pathText : `/${pathText}`;
        }

        function renderBorrowDocumentsCell(borrow) {
            const aadhaar = normalizeDocPath(borrow.aadhaarDocumentPath);
            const pan = normalizeDocPath(borrow.panDocumentPath);
            const rc = normalizeDocPath(borrow.rcDocumentPath);

            const links = [];
            if (aadhaar) {
                links.push(`<a href="${aadhaar}" target="_blank" rel="noopener noreferrer">Aadhaar</a>`);
            }
            if (pan) {
                links.push(`<a href="${pan}" target="_blank" rel="noopener noreferrer">PAN</a>`);
            }
            if (rc) {
                links.push(`<a href="${rc}" target="_blank" rel="noopener noreferrer">RC</a>`);
            }

            return links.length ? links.join(' | ') : 'Not uploaded';
        }

        async function fetchBorrowHistory() {
            try {
                const response = await fetch('/api/borrows'); 
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Fetched borrow history:', data); // Add logging
                const tableBody = document.getElementById('borrow-history-table');
                tableBody.innerHTML = '';

                if (!Array.isArray(data)) {
                    throw new Error('Invalid data format received');
                }

                document.getElementById('total-borrows').textContent = data.length;
                document.getElementById('pending-borrows').textContent = data.filter((item) => item.status === 'Pending').length;
                document.getElementById('approved-borrows').textContent = data.filter((item) => item.status === 'Approved').length;

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; font-weight:600; color:#264653;">No borrow records found.</td></tr>';
                    return;
                }

                data.forEach((borrow) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${borrow.fullname}</td>
                        <td>${borrow.email}</td>
                        <td>${borrow.mobile}</td>
                        <td>${borrow.amount}</td>
                        <td>${renderBorrowDocumentsCell(borrow)}</td>
                        <td>
                            <select onchange="updateStatus('${borrow._id}', this.value)">
                                <option value="Pending" ${borrow.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approved" ${borrow.status === 'Approved' ? 'selected' : ''}>Approved</option>
                                <option value="Rejected" ${borrow.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                            </select>
                        </td>
                        <td>${new Date(borrow.date).toLocaleString()}</td>
                        <td><button class="btn btn-danger" onclick="deleteBorrow('${borrow._id}')">Delete</button></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching borrow history:', error);
                alert('Failed to fetch borrow history. Please try again later.');
            }
        }

        async function deleteBorrow(id) {
            if (!confirm('Are you sure you want to delete this borrow entry?')) {
                return;
            }

            try {
                console.log(`Attempting to delete borrow entry with ID: ${id}`); // Add logging
                const response = await fetch(`/api/borrow/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`HTTP error! Status: ${response.status}, Message: ${errorText}`); // Add logging
                    throw new Error(`HTTP error! Status: ${response.status}, Message: ${errorText}`);
                }

                alert('Borrow entry deleted successfully');
                fetchBorrowHistory();
            } catch (error) {
                console.error('Error deleting borrow entry:', error);
                alert('Failed to delete borrow entry. Please try again later.');
            }
        }

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`/api/borrow/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                alert('Borrow status updated successfully');
                fetchBorrowHistory();
            } catch (error) {
                console.error('Error updating borrow status:', error);
                alert('Failed to update borrow status. Please try again later.');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/Login.html";
        }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        document.addEventListener('DOMContentLoaded', fetchBorrowHistory);
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</script>
<script src="admin-sidebar.js"></script>
</body>
</html>
