<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Borrow - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: radial-gradient(circle at 12% 16%, rgba(245, 158, 11, 0.28), transparent 34%), radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.34), transparent 36%), linear-gradient(145deg, #042534, #0a3c52 46%, #12506f);
            min-height: 100vh;
            margin: 0;
            display: block;
        }

        .form-container {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
            border-radius: 22px;
            box-shadow: 0 30px 70px rgba(10, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 22px;
            width: min(94%, 560px);
            margin: 1.4rem auto 2rem;
        }

        .form-container h2 {
            text-align: center;
            color: #0f1f39;
            font-size: clamp(1.4rem, 2.8vw, 2rem);
        }

        .btn-primary {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            border: none;
            font-weight: 700;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .back-button {
            display: block;
            background: linear-gradient(120deg, #0f766e, #0891b2);
            color: #fff;
            border: none;
            cursor: pointer;
            padding: 10px;
            margin: 20px auto;
            text-align: center;
            width: 200px;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            filter: brightness(1.06);
        }

        .notice {
            background: linear-gradient(120deg, #ffe2a4, #ffd58a);
            color: #543c0b;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 158, 11, 0.45);
        }

        .form-group label {
            font-weight: 700;
            color: #16324f;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid rgba(15, 31, 57, 0.2);
        }

        .form-control:focus {
            border-color: #0891b2;
            box-shadow: 0 0 0 0.2rem rgba(8, 145, 178, 0.2);
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand d-flex align-items-center" href="Login.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); transition: transform 0.3s ease;">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="moneyborrow.html">Money Borrow</a></li>
                    <li class="nav-item"><a class="nav-link" href="borrowhistory.html">Borrow History</a></li>
                    <li class="nav-item"><a class="nav-link" href="bankdetails.html">Bank Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="Chitid.html">Chitfunds</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="form-container">
        <div class="notice">
            Please ensure all your details are accurate before submitting.
        </div>
        <h2>Money Borrow Form</h2>
        <form id="borrowForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" class="form-control" id="fullname" name="fullname" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mobile">Phone Number</label>
                <input type="text" class="form-control" id="mobile" name="mobile" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" name="amount" required>
            </div>
            <div class="form-group">
                <label for="aadhaarDocument">Aadhaar Card (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="aadhaarDocument" name="aadhaarDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required>
            </div>
            <div class="form-group">
                <label for="panDocument">PAN Card (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="panDocument" name="panDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required>
            </div>
            <div class="form-group">
                <label for="rcDocument">RC Document (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="rcDocument" name="rcDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </form>
        <button class="back-button" onclick="goBack()">Back to Dashboard</button>
    </main>

    <script>
        function goBack() {
            window.location.href = "dashboard.html";
        }

        document.getElementById("borrowForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            formData.set("mobile", String(formData.get("mobile") || ""));
        
            try {
                const response = await fetch("/api/borrow", {
                    method: "POST",
                    body: formData,
                });
        
                const result = await response.json();
        
                if (response.ok) {
                    alert(result.message);
                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message || "Submission failed.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error connecting to server.");
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
