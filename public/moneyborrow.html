<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Borrow - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root {
            --ink-strong: #0d213b;
            --ink-soft: #5f748c;
            --line-soft: rgba(18, 59, 92, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.62);
            --surface-shadow: 0 24px 48px rgba(10, 20, 40, 0.18);
            --teal-a: #0f766e;
            --teal-b: #0891b2;
            --amber-a: #f59e0b;
            --amber-b: #f97316;
        }

        html[data-theme="dark"] {
            --ink-strong: #e8f0f8;
            --ink-soft: #a8b8c8;
            --line-soft: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(20, 35, 55, 0.86);
            --glass-border: rgba(255, 255, 255, 0.14);
            --surface-shadow: 0 24px 48px rgba(0, 0, 0, 0.34);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        * {
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 12% 16%, rgba(245, 158, 11, 0.24), transparent 34%),
                radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.28), transparent 36%),
                linear-gradient(145deg, #042534, #0a3c52 46%, #12506f);
            color: var(--ink-strong);
            min-height: 100vh;
            margin: 0;
            display: block;
            transition: background 0.3s ease, color 0.3s ease;
        }

        html[data-theme="dark"] body {
            background:
                radial-gradient(circle at 12% 16%, rgba(76, 217, 227, 0.12), transparent 34%),
                radial-gradient(circle at 86% 10%, rgba(8, 145, 178, 0.16), transparent 36%),
                linear-gradient(145deg, #0a1628, #0f2236 46%, #132d42);
        }

        .navbar {
            background: linear-gradient(90deg, rgba(4, 37, 52, 0.94), rgba(10, 60, 82, 0.92)) !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 20px !important;
            animation: slideInDown 0.5s ease;
        }

        .navbar-brand {
            font-weight: 800 !important;
            font-family: 'Sora', 'Manrope', sans-serif;
            letter-spacing: 0.25px;
        }

        .navbar-brand h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffc53d, #ffa726);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.88) !important;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            color: #ffc53d !important;
            transform: translateY(-2px);
        }

        .theme-toggle {
            background: linear-gradient(135deg, rgba(255, 197, 61, 0.2), rgba(255, 152, 0, 0.15));
            border: 2px solid rgba(255, 197, 61, 0.4);
            border-radius: 12px;
            padding: 8px 14px;
            cursor: pointer;
            color: #ffc53d;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            margin-left: 16px;
            min-width: 44px;
            min-height: 44px;
            box-shadow: 0 4px 12px rgba(255, 197, 61, 0.15);
        }

        .theme-toggle:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 16px rgba(255, 197, 61, 0.25);
        }

        html[data-theme="dark"] .theme-toggle {
            background: linear-gradient(135deg, rgba(76, 217, 227, 0.2), rgba(4, 144, 170, 0.15));
            border-color: rgba(76, 217, 227, 0.4);
            color: #4dd9e3;
        }

        html[data-theme="dark"] .theme-toggle:hover {
            box-shadow: 0 6px 16px rgba(76, 217, 227, 0.25);
        }

        .form-container {
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: var(--surface-shadow);
            border: 1px solid var(--glass-border);
            padding: 28px;
            width: min(94%, 680px);
            margin: 1.4rem auto 2rem;
            backdrop-filter: blur(8px);
            animation: fadeInUp 0.55s ease;
        }

        .form-container:hover {
            box-shadow: 0 30px 64px rgba(10, 20, 40, 0.22);
            transform: translateY(-2px);
        }

        .form-container h2 {
            text-align: center;
            color: var(--ink-strong);
            font-size: clamp(1.6rem, 2.8vw, 2.25rem);
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .notice {
            background: linear-gradient(120deg, rgba(245, 158, 11, 0.95), rgba(249, 115, 22, 0.92));
            color: #3f2a07;
            padding: 12px 14px;
            font-size: 0.98rem;
            font-weight: 800;
            text-align: center;
            border-radius: 14px;
            margin-bottom: 18px;
            border: 1px solid rgba(245, 158, 11, 0.45);
            box-shadow: 0 12px 24px rgba(245, 158, 11, 0.18);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            font-weight: 800;
            color: var(--ink-strong);
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid rgba(15, 31, 57, 0.16);
            background: rgba(255, 255, 255, 0.96);
            color: var(--ink-strong);
            min-height: 46px;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: #0891b2;
            box-shadow: 0 0 0 0.2rem rgba(8, 145, 178, 0.18);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(120deg, var(--teal-a), var(--teal-b));
            border: none;
            font-weight: 800;
            border-radius: 12px;
            min-height: 48px;
            box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 118, 110, 0.3);
        }

        .back-button {
            display: block;
            background: linear-gradient(120deg, var(--teal-a), var(--teal-b));
            color: #fff;
            border: none;
            cursor: pointer;
            padding: 12px 18px;
            margin: 20px auto 0;
            text-align: center;
            width: min(100%, 220px);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(15, 118, 110, 0.2);
        }

        .back-button:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 118, 110, 0.28);
            text-decoration: none;
        }

        .form-container input[type="file"] {
            padding-top: 8px;
            padding-bottom: 8px;
        }

        html:not([data-theme="dark"]) .form-container {
            background: rgba(255, 255, 255, 0.98);
        }

        html:not([data-theme="dark"]) body .form-container h2 {
            color: #0d213b !important;
        }

        html:not([data-theme="dark"]) body .form-group label {
            color: #0f2f4c !important;
        }

        html:not([data-theme="dark"]) body .form-control {
            background: #ffffff !important;
            color: #0f2f4c !important;
            border-color: rgba(15, 47, 76, 0.18) !important;
            -webkit-text-fill-color: #0f2f4c;
        }

        html:not([data-theme="dark"]) body .form-control::placeholder {
            color: rgba(15, 47, 76, 0.72) !important;
            opacity: 1;
        }

        html:not([data-theme="dark"]) body .notice {
            color: #5c3e00 !important;
        }

        html:not([data-theme="dark"]) body .back-button,
        html:not([data-theme="dark"]) body .btn-primary {
            color: #ffffff !important;
        }

        html:not([data-theme="dark"]) body .form-control[type="file"] {
            color: #0f2f4c !important;
            background: #ffffff !important;
        }

        html:not([data-theme="dark"]) body .form-control[type="file"]::-webkit-file-upload-button {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            margin-right: 12px;
            font-weight: 700;
        }

        html:not([data-theme="dark"]) body .form-control[type="file"]::file-selector-button {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            margin-right: 12px;
            font-weight: 700;
        }

        html[data-theme="dark"] .form-container {
            background: rgba(20, 35, 55, 0.88);
        }

        html[data-theme="dark"] .form-control {
            background: rgba(8, 18, 30, 0.92);
            border-color: rgba(255, 255, 255, 0.14);
            color: #e8f0f8;
        }

        html[data-theme="dark"] .form-group label,
        html[data-theme="dark"] .form-container h2 {
            color: #e8f0f8;
        }

        html[data-theme="dark"] .notice {
            background: linear-gradient(120deg, rgba(245, 158, 11, 0.2), rgba(249, 115, 22, 0.18));
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.3);
        }

        html[data-theme="dark"] .back-button {
            box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
        }

        html[data-theme="dark"] .form-control::placeholder {
            color: rgba(232, 240, 248, 0.6);
        }

        @media (max-width: 768px) {
            .form-container {
                width: min(94%, 100%);
                padding: 22px;
            }

            .navbar-brand h1 {
                font-size: 1.18rem;
            }

            .theme-toggle {
                margin-left: 10px;
            }
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 18px;
            }

            .back-button {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
    <style>
        html:not([data-theme="dark"]) body main.form-container {
            background: rgba(255, 255, 255, 0.985) !important;
            color: #0d213b !important;
        }

        html:not([data-theme="dark"]) body main.form-container h2 {
            color: #0d213b !important;
        }

        html:not([data-theme="dark"]) body main.form-container .notice {
            color: #5c3e00 !important;
        }

        html:not([data-theme="dark"]) body main.form-container label,
        html:not([data-theme="dark"]) body main.form-container .form-group label {
            color: #0f2f4c !important;
            opacity: 1 !important;
        }

        html:not([data-theme="dark"]) body main.form-container .form-control {
            background: #ffffff !important;
            color: #0f2f4c !important;
            border-color: rgba(15, 47, 76, 0.24) !important;
            -webkit-text-fill-color: #0f2f4c !important;
            opacity: 1 !important;
        }

        html:not([data-theme="dark"]) body main.form-container .form-control::placeholder {
            color: rgba(15, 47, 76, 0.72) !important;
            opacity: 1 !important;
        }

        html:not([data-theme="dark"]) body main.form-container .btn-primary,
        html:not([data-theme="dark"]) body main.form-container .back-button {
            color: #ffffff !important;
        }

        html:not([data-theme="dark"]) body main.form-container .form-control[type="file"] {
            color: #0f2f4c !important;
            background: #ffffff !important;
        }

        html:not([data-theme="dark"]) body main.form-container .form-control[type="file"]::file-selector-button,
        html:not([data-theme="dark"]) body main.form-container .form-control[type="file"]::-webkit-file-upload-button {

            color: #ffffff !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 8px 12px !important;
            margin-right: 12px !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand d-flex align-items-center" href="Login.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); transition: transform 0.3s ease;">
                <h1>Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="moneyborrow.html">Money Borrow</a></li>
                    <li class="nav-item"><a class="nav-link" href="borrowhistory.html">Borrow History</a></li>
                    <li class="nav-item"><a class="nav-link" href="bankdetails.html">Bank Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="Chitid.html">Chitfunds</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="form-container">
        <div class="notice">
            Please ensure all your details are accurate before submitting.
        </div>
        <h2 style="color:#0d213b !important;">Money Borrow Form</h2>
        <form id="borrowForm">
            <div class="form-group">
                <label for="fullname" style="color:#0f2f4c !important; opacity:1 !important;">Full Name</label>
                <input type="text" class="form-control" id="fullname" name="fullname" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="email" style="color:#0f2f4c !important; opacity:1 !important;">Email</label>
                <input type="email" class="form-control" id="email" name="email" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="mobile" style="color:#0f2f4c !important; opacity:1 !important;">Phone Number</label>
                <input type="text" class="form-control" id="mobile" name="mobile" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="amount" style="color:#0f2f4c !important; opacity:1 !important;">Amount</label>
                <input type="number" class="form-control" id="amount" name="amount" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="aadhaarDocument" style="color:#0f2f4c !important; opacity:1 !important;">Aadhaar Card (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="aadhaarDocument" name="aadhaarDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="panDocument" style="color:#0f2f4c !important; opacity:1 !important;">PAN Card (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="panDocument" name="panDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <div class="form-group">
                <label for="rcDocument" style="color:#0f2f4c !important; opacity:1 !important;">RC Document (PDF/JPG/PNG)</label>
                <input type="file" class="form-control" id="rcDocument" name="rcDocument" accept=".pdf,.jpg,.jpeg,.png,.webp" required style="background:#ffffff !important; color:#0f2f4c !important; border-color:rgba(15, 47, 76, 0.24) !important; -webkit-text-fill-color:#0f2f4c !important;">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </form>
        <button class="back-button" onclick="goBack()">Back to Dashboard</button>
    </main>

    <script>
        function initializeTheme() {
            const savedTheme = localStorage.getItem('moneyborrow-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeToggle(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('moneyborrow-theme', nextTheme);
            updateThemeToggle(nextTheme);
        }

        function updateThemeToggle(theme) {
            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
                toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTheme);
        } else {
            initializeTheme();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', (event) => {
                    event.preventDefault();
                    toggleTheme();
                });
            }

            document.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key === 'D') {
                    event.preventDefault();
                    toggleTheme();
                }
            });
        });

        function goBack() {
            window.location.href = "dashboard.html";
        }

        document.getElementById("borrowForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            formData.set("mobile", String(formData.get("mobile") || ""));
        
            try {
                const response = await fetch("/api/borrow", {
                    method: "POST",
                    body: formData,
                });
        
                const result = await response.json();
        
                if (response.ok) {
                    alert(result.message);
                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message || "Submission failed.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error connecting to server.");
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

</body>
