<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chit Fund System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #11998e, #38ef7d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .form-container h2 {
            text-align: center;
            color: #333333;
        }

        .btn-primary {
            background: #11998e;
            border: none;
        }

        .btn-primary:hover {
            background: #38ef7d;
        }

        .btn-secondary {
            margin-top: 10px;
            background: #444;
            border: none;
        }

        .btn-secondary:hover {
            background: #333;
        }

        footer {
            margin-top: 20px;
            color: white;
            font-size: 0.8rem;
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <header>
                <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(45deg, #090a0b, #6610f2);">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); transition: transform 0.3s ease;">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="ChittyPlans.html">Chits Plans</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payment Form</a></li>
                    <li class="nav-item"><a class="nav-link" href="home.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="form-container">
        <h2>Register</h2>
        <div id="message" class="alert d-none"></div>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" class="form-control" id="fullname" name="fullname" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mobile">Phone Number</label>
                <input type="text" class="form-control" id="mobile" name="mobile" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        <button onclick="location.href='Login.html'" class="btn btn-secondary btn-block">Back to Login</button>
    </main>

    <footer class="text-center">
        <p>&copy; 2023 Chit Fund System. All Rights Reserved.</p>
    </footer>

    <script>
        const REGISTER_API_BASES = [
            '/api',
            '',
            window.LOGIN_API_BASE || ''
        ].filter((base, index, arr) => base !== undefined && arr.indexOf(base) === index);

        async function postRegisterWithFallback(path, payload) {
            let lastError = null;
            for (const base of REGISTER_API_BASES) {
                try {
                    const response = await fetch(`${base}${path}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json().catch(() => ({}));
                    return { response, result };
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('No backend is reachable');
        }

        document.getElementById("registerForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
        
            data.mobile = String(data.mobile); // Ensure mobile is a string
        
            try {
                console.log("Sending data:", data);
                const { response, result } = await postRegisterWithFallback('/register', data);
        
                const message = document.getElementById("message");
                message.classList.remove("d-none", "alert-success", "alert-danger");
        
                if (response.ok) {
                    message.classList.add("alert-success");
                    message.textContent = result.message;
                    setTimeout(() => { window.location.href = "Login.html"; }, 2000);
                } else {
                    message.classList.add("alert-danger");
                    message.textContent = result.message || "Registration failed.";
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error connecting to server.");
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
