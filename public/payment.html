<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Dhanam Chits Pvt. Ltd</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f4f8fb;
            color: #10213a;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(45deg, #090a0b, #6610f2);
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand h1 {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .navbar-toggler {
            border-color: transparent;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml;charset=UTF8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cpath stroke='black' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: bold;
        }

        .navbar-nav .nav-link:hover {
            color: #ffc107 !important;
            text-decoration: underline;
        }

        .container {
            width: min(94%, 760px);
            margin: 1.4rem auto 2rem;
            padding: 24px;
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.9));
            box-shadow: 0 30px 70px rgba(10, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .title {
            margin: 0 0 14px;
            color: #0f1f39;
            font-weight: 800;
        }

        .subtitle {
            margin: 0 0 18px;
            color: #254564;
            font-weight: 600;
        }

        .helper {
            font-size: 0.9rem;
            color: #274766;
            margin-top: 6px;
        }

        .btn-primary {
            background: linear-gradient(120deg, #0f766e, #0891b2);
            border: none;
            font-weight: 700;
        }

        .btn-cashfree {
            background: linear-gradient(120deg, #0f172a, #0b607f);
            border: none;
            color: #fff;
            font-weight: 700;
            margin-left: 8px;
        }

        .payment-status {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
        }

        .payment-status.info {
            display: block;
            background: rgba(8, 145, 178, 0.12);
            color: #0b607f;
            border: 1px solid rgba(8, 145, 178, 0.25);
        }

        .payment-status.error {
            display: block;
            background: rgba(185, 28, 28, 0.1);
            color: #9f1239;
            border: 1px solid rgba(185, 28, 28, 0.2);
        }

        .payment-status.success {
            display: block;
            background: rgba(15, 118, 110, 0.12);
            color: #0f766e;
            border: 1px solid rgba(15, 118, 110, 0.22);
        }

        .payment-select {
            min-height: 52px;
            height: auto;
            line-height: 1.35;
            padding-top: 0.85rem !important;
            padding-bottom: 0.85rem !important;
            color: #10213a;
            background-color: #ffffff !important;
            appearance: auto;
        }

        .payment-select option {
            color: #10213a;
        }

        #userChitBorrowInfo {
            display: none;
            margin-bottom: 1rem;
        }

        .lookup-card {
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(16, 33, 58, 0.1);
            box-shadow: 0 16px 30px rgba(10, 20, 40, 0.12);
            background: linear-gradient(180deg, #ffffff, #f7fbff);
        }

        .lookup-card.is-info {
            border-color: rgba(8, 145, 178, 0.18);
            background: linear-gradient(180deg, #f7fdff, #ffffff);
        }

        .lookup-card.is-success {
            border-color: rgba(15, 118, 110, 0.18);
            background: linear-gradient(180deg, #f5fffc, #ffffff);
        }

        .lookup-card.is-warning {
            border-color: rgba(245, 158, 11, 0.22);
            background: linear-gradient(180deg, #fffaf0, #ffffff);
        }

        .lookup-title {
            margin: 0 0 10px;
            font-weight: 800;
            color: #0f1f39;
        }

        .lookup-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 14px;
        }

        .lookup-item {
            background: rgba(15, 76, 129, 0.05);
            border: 1px solid rgba(15, 76, 129, 0.08);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .lookup-item span {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #47607f;
            margin-bottom: 4px;
        }

        .lookup-item strong {
            display: block;
            font-size: 1rem;
            color: #10213a;
            word-break: break-word;
        }

        .lookup-note {
            margin-top: 10px;
            font-size: 0.88rem;
            color: #4f6782;
        }

        .hidden-payment-type {
            display: none;
        }

        @media (max-width: 576px) {
            .container {
                margin-top: 1rem;
                padding: 18px;
            }

            .btn-cashfree {
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
    <link rel="stylesheet" href="premium-shared.css">
    <link rel="stylesheet" href="index-theme.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo.jpeg" alt="Logo" style="height: 50px; margin-right: 15px; border-radius: 50%;">
                <h1 style="font-size: 1.5rem; margin: 0; color: white;">Dhanam Chits Pvt. Ltd</h1>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="ChittyPlans.html">Chit Plans</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payment Form</a></li>
                    <li class="nav-item"><a class="nav-link" href="home.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <h2 class="title">Secure Payment Form</h2>
        <p class="subtitle">Pay your chit amount using manual transfer or Cashfree gateway.</p>

        <form id="paymentForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>


            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="text" class="form-control" id="mobile" maxlength="10" required>
            </div>
            <div id="userChitBorrowInfo" style="display:none; margin-bottom: 1rem;"></div>

            <div class="form-group">
                <label for="chitsPlan">CHIT ID/BORROW PAYMENT</label>
                <select class="form-control payment-select" id="chitsPlan" required>
                    <option value="" selected disabled>Select CHIT ID / BORROW PAYMENT</option>
                    <option value="CHIT ID">CHIT ID</option>
                    <option value="BORROW PAYMENT">BORROW PAYMENT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" min="1" required>
                <div class="helper">Enter the amount you are paying now.</div>
            </div>

            <div class="form-group hidden-payment-type" id="paymentTypeGroup">
                <label for="type">Payment Type</label>
                <input type="text" class="form-control" id="type" value="Chit Payment" readonly>
            </div>

            <div class="form-group hidden-payment-type" id="paymentMethodGroup">
                <label>Payment Method</label>
                <div>
                    <button type="button" class="btn btn-primary" id="manualSubmitBtn">Submit Manual UTR Payment</button>
                    <button type="button" class="btn btn-cashfree" id="cashfreePayBtn">Pay with Cashfree</button>
                </div>
            </div>

            <div id="serviceChargeInfo" style="display:none; margin-top:10px; margin-bottom:10px;"></div>
            <div id="paymentStatus" class="payment-status"></div>
        </form>
    </main>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user) {
            document.getElementById('name').value = user.fullname || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('mobile').value = user.mobile || '';
        }

        const paymentForm = document.getElementById('paymentForm');
        const manualSubmitBtn = document.getElementById('manualSubmitBtn');
        const cashfreePayBtn = document.getElementById('cashfreePayBtn');
        const paymentStatus = document.getElementById('paymentStatus');
        const userChitBorrowInfo = document.getElementById('userChitBorrowInfo');
        const mobileInput = document.getElementById('mobile');
        const chitsPlanSelect = document.getElementById('chitsPlan');
        const amountInput = document.getElementById('amount');
        const paymentTypeInput = document.getElementById('type');
        const paymentTypeGroup = document.getElementById('paymentTypeGroup');
        const paymentMethodGroup = document.getElementById('paymentMethodGroup');
        let lookupTimer = null;
        let selectedChitIdForPayment = '';

        function setPaymentStatus(message, type = 'info') {
            paymentStatus.textContent = message;
            paymentStatus.className = `payment-status ${type}`;
        }

        function clearPaymentStatus() {
            paymentStatus.textContent = '';
            paymentStatus.className = 'payment-status';
        }

        function setButtonsDisabled(disabled) {
            manualSubmitBtn.disabled = disabled;
            cashfreePayBtn.disabled = disabled;
        }

        async function apiFetch(url, options = {}) {
            const mergedOptions = {
                credentials: 'include',
                ...options,
                headers: {
                    ...(options.headers || {}),
                },
            };

            const response = await fetch(url, mergedOptions);
            if (response.status === 401 || response.status === 403) {
                const message = response.status === 401
                    ? 'Your session has expired. Please login again.'
                    : 'You are not authorized for this action.';
                alert(message);
                window.location.href = 'Login.html';
                throw new Error(message);
            }

            return response;
        }

        function normalizeText(value) {
            return String(value || '').trim().toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatAmount(value) {
            const amount = Number(value) || 0;
            return `₹${amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function setPaymentTypeFromSelection() {
            paymentTypeInput.value = chitsPlanSelect.value === 'BORROW PAYMENT' ? 'Borrow Payment' : 'Chit Payment';
        }

        function togglePaymentTypeVisibility() {
            const amountValue = Number(amountInput.value);
            const shouldShow = Number.isFinite(amountValue) && amountValue > 0;
            paymentTypeGroup.classList.toggle('hidden-payment-type', !shouldShow);
            paymentMethodGroup.classList.toggle('hidden-payment-type', !shouldShow);
        }

        function showLookupInfo(html, tone = 'is-info') {
            userChitBorrowInfo.className = `lookup-card ${tone}`;
            userChitBorrowInfo.innerHTML = html;
            userChitBorrowInfo.style.display = 'block';
        }

        function hideLookupInfo() {
            userChitBorrowInfo.innerHTML = '';
            userChitBorrowInfo.style.display = 'none';
            selectedChitIdForPayment = '';
        }

        async function loadSelectionDetails() {
            const mobile = String(mobileInput.value || '').replace(/\D/g, '').trim();
            const selection = String(chitsPlanSelect.value || '').trim();

            if (!selection || mobile.length !== 10) {
                hideLookupInfo();
                return;
            }

            showLookupInfo('<div class="lookup-title">Loading details...</div>', 'is-info');

            try {
                const paymentsResponse = await apiFetch(`/api/payments/${encodeURIComponent(mobile)}`);
                const paymentRows = await paymentsResponse.json().catch(() => []);
                const approvedPayments = Array.isArray(paymentRows)
                    ? paymentRows.filter((item) => normalizeText(item.status) === 'approved')
                    : [];

                if (selection === 'CHIT ID') {
                    const response = await apiFetch(`/api/chit-ids/mobile/${encodeURIComponent(mobile)}`);
                    const data = await response.json().catch(() => []);

                    if (!response.ok) {
                        if (response.status === 404) {
                            showLookupInfo(
                                '<div class="lookup-title">No Chit ID found</div><div class="lookup-note">No Chit ID is linked to this mobile number.</div>',
                                'is-warning'
                            );
                            return;
                        }
                        throw new Error(data.message || 'Failed to load Chit ID details.');
                    }

                    if (!Array.isArray(data) || data.length === 0) {
                        showLookupInfo(
                            '<div class="lookup-title">No Chit ID found</div><div class="lookup-note">No Chit ID records are linked to this mobile number.</div>',
                            'is-warning'
                        );
                        return;
                    }

                    const approvedRecord = data.find((item) => String(item.status || '').trim().toLowerCase() === 'approved') || data[0];
                    selectedChitIdForPayment = String(approvedRecord.chitId || '').trim();
                    const totalBalance = Number(approvedRecord.totalBalance) || 0;
                    const totalPaidFromChit = Number(approvedRecord.totalPaid) || 0;
                    const totalPaidFromApprovedPayments = approvedPayments
                        .filter((payment) => normalizeText(payment.chitsPlan) === normalizeText(selectedChitIdForPayment))
                        .reduce((sum, payment) => sum + (Number(payment.amount) || 0), 0);
                    const totalPaid = Math.max(totalPaidFromChit, totalPaidFromApprovedPayments);
                    const balanceDue = Math.max(totalBalance - totalPaid, 0);

                    showLookupInfo(`
                        <div class="lookup-title">Chit Details</div>
                        <div class="lookup-grid">
                            <div class="lookup-item"><span>Chit ID</span><strong>${escapeHtml(approvedRecord.chitId || 'N/A')}</strong></div>
                            <div class="lookup-item"><span>Status</span><strong>${escapeHtml(approvedRecord.status || 'N/A')}</strong></div>
                            <div class="lookup-item"><span>Total Paid</span><strong>${formatAmount(totalPaid)}</strong></div>
                            <div class="lookup-item"><span>Balance Due</span><strong>${formatAmount(balanceDue)}</strong></div>
                        </div>
                        <div class="lookup-note">Only approved payments are considered for the live balance.</div>
                    `, 'is-success');
                    return;
                }

                if (selection === 'BORROW PAYMENT') {
                    const response = await apiFetch(`/api/borrow-history/${encodeURIComponent(mobile)}`);
                    const data = await response.json().catch(() => []);

                    if (!response.ok) {
                        throw new Error(data.message || 'Failed to load borrow details.');
                    }

                    if (!Array.isArray(data) || data.length === 0) {
                        showLookupInfo(
                            '<div class="lookup-title">No Borrow record found</div><div class="lookup-note">No borrow entry is linked to this mobile number.</div>',
                            'is-warning'
                        );
                        return;
                    }

                    const approvedRecord = data.find((item) => String(item.status || '').trim().toLowerCase() === 'approved') || data[0];
                    const borrowAmount = Number(approvedRecord.amount) || 0;
                    const paidBorrowAmount = approvedPayments
                        .filter((payment) => {
                            const paymentType = normalizeText(payment.type);
                            const paymentPlan = normalizeText(payment.chitsPlan);
                            return paymentType.includes('borrow') || paymentPlan === 'borrow payment';
                        })
                        .reduce((sum, payment) => sum + (Number(payment.amount) || 0), 0);
                    const balanceDue = Math.max(borrowAmount - paidBorrowAmount, 0);

                    showLookupInfo(`
                        <div class="lookup-title">Borrow Details</div>
                        <div class="lookup-grid">
                            <div class="lookup-item"><span>Borrow Amount</span><strong>${formatAmount(borrowAmount)}</strong></div>
                            <div class="lookup-item"><span>Paid (Approved)</span><strong>${formatAmount(paidBorrowAmount)}</strong></div>
                            <div class="lookup-item"><span>Balance Due</span><strong>${formatAmount(balanceDue)}</strong></div>
                            <div class="lookup-item"><span>Status</span><strong>${escapeHtml(approvedRecord.status || 'N/A')}</strong></div>
                            <div class="lookup-item"><span>Mobile</span><strong>${escapeHtml(approvedRecord.mobile || mobile)}</strong></div>
                        </div>
                        <div class="lookup-note">Only approved borrow payments are deducted from the balance.</div>
                    `, 'is-success');
                }
            } catch (error) {
                console.error('Lookup details error:', error);
                showLookupInfo(
                    `<div class="lookup-title">Unable to load details</div><div class="lookup-note">${escapeHtml(error.message || 'Please try again.')}</div>`,
                    'is-warning'
                );
            }
        }

        function scheduleSelectionDetails() {
            clearTimeout(lookupTimer);
            lookupTimer = setTimeout(loadSelectionDetails, 250);
        }

        setPaymentTypeFromSelection();
        togglePaymentTypeVisibility();
        mobileInput.addEventListener('input', scheduleSelectionDetails);
        mobileInput.addEventListener('blur', scheduleSelectionDetails);
        amountInput.addEventListener('input', togglePaymentTypeVisibility);
        amountInput.addEventListener('change', togglePaymentTypeVisibility);
        chitsPlanSelect.addEventListener('change', () => {
            setPaymentTypeFromSelection();
            scheduleSelectionDetails();
        });

        if (String(mobileInput.value || '').replace(/\D/g, '').length === 10 && chitsPlanSelect.value) {
            scheduleSelectionDetails();
        }

        function collectPaymentPayload(includeUtr = true) {
            const selectedMode = document.getElementById('chitsPlan').value.trim();
            const resolvedPlan = selectedMode === 'CHIT ID'
                ? (selectedChitIdForPayment || '')
                : selectedMode;

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                mobile: document.getElementById('mobile').value.trim(),
                chitsPlan: resolvedPlan,
                amount: Number(document.getElementById('amount').value),
                type: document.getElementById('type').value.trim(),
            };

            if (selectedMode === 'CHIT ID' && !resolvedPlan) {
                throw new Error('Unable to resolve Chit ID. Select CHIT ID and check mobile details again.');
            }

            if (!payload.name || !payload.email || !payload.mobile || !payload.chitsPlan || !payload.amount || payload.amount <= 0) {
                throw new Error('Name, email, mobile, chit plan and amount are required.');
            }

            return payload;
        }

        manualSubmitBtn.addEventListener('click', () => {
            try {
                const payload = collectPaymentPayload(false);
                const query = new URLSearchParams({
                    name: payload.name,
                    email: payload.email,
                    mobile: payload.mobile,
                    chitsPlan: payload.chitsPlan,
                    amount: String(payload.amount || ''),
                    type: payload.type,
                });
                window.location.href = `manualpay.html?${query.toString()}`;
            } catch (error) {
                setPaymentStatus(error.message || 'Please complete required fields first.', 'error');
            }
        });

        cashfreePayBtn.addEventListener('click', async () => {
            try {
                clearPaymentStatus();
                setButtonsDisabled(true);
                const serviceChargeInfo = document.getElementById('serviceChargeInfo');
                serviceChargeInfo.style.display = 'none';
                serviceChargeInfo.innerHTML = '';

                // Step 1: Ask backend for service charge and total
                const amount = Number(document.getElementById('amount').value);
                if (!amount || amount <= 0) {
                    setPaymentStatus('Please enter a valid amount.', 'error');
                    setButtonsDisabled(false);
                    return;
                }
                setPaymentStatus('Calculating service charge...', 'info');
                const res = await apiFetch('/api/cashfree/service-charge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || typeof data.serviceCharge !== 'number' || typeof data.total !== 'number') {
                    throw new Error(data.message || 'Failed to calculate service charge.');
                }
                serviceChargeInfo.style.display = 'block';
                serviceChargeInfo.innerHTML = `<b>Service Charge (0.25%):</b> ₹${data.serviceCharge.toFixed(2)}<br><b>Total Payable:</b> ₹${data.total.toFixed(2)}`;

                // Step 2: Confirm with user before proceeding
                if (!confirm(`A service charge of ₹${data.serviceCharge.toFixed(2)} will be added. Total payable: ₹${data.total.toFixed(2)}.\nProceed to payment?`)) {
                    setButtonsDisabled(false);
                    return;
                }

                setPaymentStatus('Creating Cashfree order...', 'info');
                const paymentData = collectPaymentPayload(false);
                paymentData.type = 'Chit Payment (Cashfree)';
                paymentData.amount = data.total; // Use total with service charge

                const createOrderResponse = await apiFetch('/api/cashfree/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData),
                });

                const createOrderResult = await createOrderResponse.json().catch(() => ({}));
                if (!createOrderResponse.ok) {
                    throw new Error(createOrderResult.message || 'Unable to initialize Cashfree payment.');
                }

                if (!window.Cashfree || !createOrderResult.paymentSessionId) {
                    throw new Error('Cashfree SDK failed to initialize. Please refresh and try again.');
                }

                const cashfree = window.Cashfree({ mode: createOrderResult.cashfreeMode || 'sandbox' });
                setPaymentStatus('Opening Cashfree checkout...', 'info');

                const checkoutResult = await cashfree.checkout({
                    paymentSessionId: createOrderResult.paymentSessionId,
                    redirectTarget: '_modal',
                });

                if (checkoutResult?.error) {
                    throw new Error(checkoutResult.error.message || 'Cashfree checkout failed.');
                }

                setPaymentStatus('Verifying payment status...', 'info');

                const verifyResponse = await apiFetch('/api/cashfree/confirm-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: createOrderResult.orderId,
                        paymentData,
                    }),
                });

                const verifyResult = await verifyResponse.json().catch(() => ({}));
                if (!verifyResponse.ok) {
                    throw new Error(verifyResult.message || 'Payment verification failed.');
                }

                setPaymentStatus(verifyResult.message || 'Payment completed successfully.', 'success');
                alert(verifyResult.message || 'Payment completed successfully.');
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Cashfree payment error:', error);
                setPaymentStatus(error.message || 'Cashfree payment failed. Please try again.', 'error');
                alert(error.message || 'Cashfree payment failed. Please try again.');
            } finally {
                setButtonsDisabled(false);
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
