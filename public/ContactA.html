<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            background: #f8f9fa;
        }

        body {
            display: block !important;
            min-height: 100vh;
            background: #e0f7fa;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #576d83;
            color: white;
            padding: 20px;
            position: fixed;
            transition: all 0.3s;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            margin: 10px 0;
            border-radius: 5px;
        }
        .sidebar a:hover {
            background: #3f5367;
        }
        .content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 20px;
            transition: margin-left 0.3s;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-danger, .btn-primary {
            border-radius: 5px;
        }
        .menu-toggle {
            display: none;
            position: fixed;
            left: 10px;
            top: 10px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            z-index: 1000;
        }
        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e74c3c;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            margin-top: 50px;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
          }
          .logout-btn:hover {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            transform: scale(1.05);
          }

        .contact-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .contact-toolbar h1 {
            margin: 0;
            color: #0f2a3f;
            text-shadow: none;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .toolbar-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 10px;
            background: linear-gradient(120deg, #0b607f, #1f8a70);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(10, 43, 64, 0.22);
        }

        .toolbar-btn:hover {
            filter: brightness(1.08);
        }

        .quick-stats {
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: linear-gradient(120deg, rgba(12, 55, 86, 0.94), rgba(24, 119, 145, 0.9));
            color: #f1f8ff;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 8px 20px rgba(9, 40, 65, 0.2);
        }

        .stat-card .label {
            display: block;
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.28rem;
            font-weight: 800;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 14px;
            box-shadow: 0 12px 26px rgba(16, 49, 75, 0.16);
            padding: 10px;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .content {
            overflow-x: hidden;
        }

        @media (max-width: 576px) {
            .contact-toolbar {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
            }

            .contact-toolbar h1 {
                font-size: 2rem;
                line-height: 1.05;
                max-width: calc(100% - 120px);
            }

            .toolbar-btn {
                margin-left: auto;
                padding: 8px 12px;
            }

            .quick-stats {
                grid-template-columns: 1fr;
            }

            .table {
                width: max-content;
                min-width: 980px;
                white-space: nowrap;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 10px;
            }
            .sidebar a span {
                display: none;
            }
            .content {
                margin-left: 60px;
                width: calc(100% - 60px);
            }
            .table-container {
                padding: 10px;
            }
            .table th, .table td {
                font-size: 0.8rem;
                padding: 8px;
            }
            .menu-toggle {
                display: block;
            }
        }
    </style>
    <link rel="stylesheet" href="admin-sidebar.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <!-- Toggle Button -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="admin.html"><i class="fas fa-tachometer-alt"></i> <span class="menu-text">Dashboard</span></a>
        <a href="users.html"><i class="fas fa-users"></i> <span class="menu-text">Users</span></a>
        <a href="bankdetailA.html"><i class="fas fa-university"></i> <span class="menu-text">Bank Details</span></a>
        <a href="ChitidA.html"><i class="fas fa-university"></i> <span class="menu-text">chit-ids Approve</span></a>
        <a href="borrowA.html"><i class="fas fa-hand-holding-usd"></i> <span class="menu-text">Borrows</span></a>
        <a href="paymentA.html"><i class="fas fa-credit-card"></i> <span class="menu-text">Payments</span></a>
        <a href="contactA.html"><i class="fas fa-envelope"></i> <span class="menu-text">Contact Details</span></a>
        <a href="index.html" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span class="menu-text">Logout</span></a>
      </div>
    <div class="content">
        <div class="contact-toolbar">
            <h1>Contact Submissions</h1>
            <button class="toolbar-btn" onclick="fetchContactDetails()">Refresh</button>
        </div>

        <div class="quick-stats">
            <div class="stat-card">
                <span class="label">Total Complaints</span>
                <span class="value" id="total-contacts">0</span>
            </div>
            <div class="stat-card">
                <span class="label">Unique Mobile Numbers</span>
                <span class="value" id="unique-contact-mobiles">0</span>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="contact-details-table">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const CONTACT_ADMIN_BASES = ['', ''];

        async function fetchContactApi(path, options = {}) {
            let lastError = null;
            for (const base of CONTACT_ADMIN_BASES) {
                try {
                    return await fetch(`${base}${path}`, options);
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('No contact backend is reachable');
        }

        async function fetchContactDetails() {
            try {
                const response = await fetchContactApi('/api/contacts');
                const data = await response.json();
                const tableBody = document.getElementById('contact-details-table');
                tableBody.innerHTML = '';

                if (!Array.isArray(data)) {
                    throw new Error('Invalid data format received');
                }

                document.getElementById('total-contacts').textContent = data.length;
                document.getElementById('unique-contact-mobiles').textContent = new Set(data.map((item) => item.mobile)).size;

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; font-weight:600; color:#264653;">No contact submissions found.</td></tr>';
                    return;
                }

                data.forEach((contact) => {
                    const row = `<tr>
                        <td>${contact.name}</td>
                        <td>${contact.email}</td>
                        <td>${contact.mobile}</td>
                        <td>${contact.message}</td>
                        <td>${new Date(contact.date).toLocaleString()}</td>
                        <td><button class="btn btn-danger" onclick="deleteContact('${contact._id}')">Delete</button></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                alert('Failed to fetch contact details.');
            }
        }
        async function deleteContact(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await fetchContactApi(`/api/contacts/${id}`, { method: 'DELETE' });
                fetchContactDetails();
            } catch (error) {
                alert('Failed to delete contact.');
            }
        }
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }
        document.addEventListener('DOMContentLoaded', fetchContactDetails);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
