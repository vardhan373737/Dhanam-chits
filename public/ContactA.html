<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Submissions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --ink-strong: #0d213b;
            --ink-soft: #587592;
            --line-soft: rgba(24, 55, 89, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(255, 255, 255, 0.6);
            --surface-shadow: 0 20px 42px rgba(16, 49, 75, 0.16);
            --blue-a: #1d4ed8;
            --blue-b: #0284c7;
            --red-a: #dc2626;
            --red-b: #ef4444;
            --teal-a: #0f766e;
            --teal-b: #0891b2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', 'Segoe UI', sans-serif;
        }

        body {
            display: block !important;
            min-height: 100vh;
            background:
                radial-gradient(circle at 8% 12%, rgba(8, 145, 178, 0.2), transparent 28%),
                radial-gradient(circle at 90% 8%, rgba(37, 99, 235, 0.16), transparent 24%),
                linear-gradient(160deg, #e9f7fb 0%, #eef5ff 45%, #f8fbfd 100%);
            color: var(--ink-strong);
        }

        .content {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 20px;
            transition: margin-left 0.3s;
            overflow-x: hidden;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            left: 10px;
            top: 10px;
            background: linear-gradient(120deg, #0f3f66, #136f8f);
            color: #fff;
            border: none;
            padding: 9px 11px;
            cursor: pointer;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(8, 42, 63, 0.25);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, var(--red-a), var(--red-b));
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-top: 50px;
            color: white;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .logout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(220, 38, 38, 0.35);
        }

        .contact-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .contact-toolbar h1 {
            margin: 0;
            color: #0f2a3f;
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 800;
            letter-spacing: 0.2px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        .toolbar-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            background: linear-gradient(120deg, var(--teal-a), var(--teal-b));
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(10, 43, 64, 0.22);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .toolbar-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(10, 43, 64, 0.28);
        }

        .quick-stats {
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: linear-gradient(125deg, rgba(12, 55, 86, 0.95), rgba(25, 129, 157, 0.88));
            color: #f1f8ff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 12px 24px rgba(9, 40, 65, 0.23);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 999px;
            right: -52px;
            top: -70px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
        }

        .stat-card .label {
            display: block;
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.28rem;
            font-weight: 800;
        }

        .table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--surface-shadow);
            padding: 12px;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            backdrop-filter: blur(6px);
        }

        .table {
            margin-bottom: 0;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
        }

        .table th,
        .table td {
            border-color: var(--line-soft);
            text-align: center;
            vertical-align: middle;
            color: var(--ink-strong);
        }

        .table thead th {
            background: linear-gradient(90deg, #2482d8, #509ee6);
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.2px;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .table tbody tr:hover {
            background-color: rgba(33, 150, 243, 0.08);
        }

        .btn-danger,
        .btn-primary {
            border-radius: 10px;
            font-weight: 700;
        }

        .btn-danger {
            border: none;
            background: linear-gradient(120deg, var(--red-a), var(--red-b));
            box-shadow: 0 8px 16px rgba(220, 38, 38, 0.25);
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                width: 60px;
                padding: 10px;
            }

            .sidebar a span {
                display: none;
            }

            .content {
                margin-left: 60px;
                width: calc(100% - 60px);
            }

            .table-container {
                padding: 10px;
            }

            .table th,
            .table td {
                font-size: 0.82rem;
                padding: 8px;
            }
        }

        @media (max-width: 576px) {
            .contact-toolbar {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
            }

            .contact-toolbar h1 {
                line-height: 1.05;
                max-width: calc(100% - 120px);
            }

            .toolbar-btn {
                margin-left: auto;
                padding: 8px 12px;
            }

            .quick-stats {
                grid-template-columns: 1fr;
            }

            .table {
                width: max-content;
                min-width: 980px;
                white-space: nowrap;
            }
        }
    </style>
    <link rel="stylesheet" href="admin-sidebar.css">
    <link rel="stylesheet" href="index-theme.css">
</head>
<body>
    <!-- Toggle Button -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="admin.html"><i class="fas fa-tachometer-alt"></i> <span class="menu-text">Dashboard</span></a>
        <a href="users.html"><i class="fas fa-users"></i> <span class="menu-text">Users</span></a>
                    <a href="adminbank.html"><i class="fas fa-university"></i> <span class="menu-text">Admin-Bank</span></a>

        <a href="bankdetailA.html"><i class="fas fa-university"></i> <span class="menu-text">Bank Details</span></a>
        <a href="ChitIdA.html"><i class="fas fa-university"></i> <span class="menu-text">chit-ids Approve</span></a>
        <a href="borrowA.html"><i class="fas fa-hand-holding-usd"></i> <span class="menu-text">Borrows</span></a>
        <a href="paymentA.html"><i class="fas fa-credit-card"></i> <span class="menu-text">Payments</span></a>
        <a href="ContactA.html"><i class="fas fa-envelope"></i> <span class="menu-text">Contact Details</span></a>
        <a href="/Login.html" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span class="menu-text">Logout</span></a>
      </div>
    <div class="content">
        <div class="contact-toolbar">
            <h1>Contact Submissions</h1>
            <button class="toolbar-btn" onclick="fetchContactDetails()">Refresh</button>
        </div>

        <div class="quick-stats">
            <div class="stat-card">
                <span class="label">Total Complaints</span>
                <span class="value" id="total-contacts">0</span>
            </div>
            <div class="stat-card">
                <span class="label">Unique Mobile Numbers</span>
                <span class="value" id="unique-contact-mobiles">0</span>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="contact-details-table">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const CONTACT_ADMIN_BASES = ['', ''];

        async function fetchContactApi(path, options = {}) {
            let lastError = null;
            for (const base of CONTACT_ADMIN_BASES) {
                try {
                    return await fetch(`${base}${path}`, options);
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('No contact backend is reachable');
        }

        async function fetchContactDetails() {
            try {
                const response = await fetchContactApi('/api/contacts');
                const data = await response.json();
                const tableBody = document.getElementById('contact-details-table');
                tableBody.innerHTML = '';

                if (!Array.isArray(data)) {
                    throw new Error('Invalid data format received');
                }

                document.getElementById('total-contacts').textContent = data.length;
                document.getElementById('unique-contact-mobiles').textContent = new Set(data.map((item) => item.mobile)).size;

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; font-weight:600; color:#264653;">No contact submissions found.</td></tr>';
                    return;
                }

                data.forEach((contact) => {
                    const row = `<tr>
                        <td>${contact.name}</td>
                        <td>${contact.email}</td>
                        <td>${contact.mobile}</td>
                        <td>${contact.message}</td>
                        <td>${new Date(contact.date).toLocaleString()}</td>
                        <td><button class="btn btn-danger" onclick="deleteContact('${contact._id}')">Delete</button></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                alert('Failed to fetch contact details.');
            }
        }
        async function deleteContact(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await fetchContactApi(`/api/contacts/${id}`, { method: 'DELETE' });
                fetchContactDetails();
            } catch (error) {
                alert('Failed to delete contact.');
            }
        }
        function logout() {
            localStorage.clear();
            window.location.href = "/Login.html";
        }
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }
        document.addEventListener('DOMContentLoaded', fetchContactDetails);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
